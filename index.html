<!DOCTYPE html>
<html>
  <head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- Este es el componente de animaciones -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiWarning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Asegúrate de que el nombre del archivo sea igual a este -->
        <a-asset-item id="miModelo" src="./modelo.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
  <a-gltf-model 
    src="#miModelo" 
    position="0 0 0" 
    scale="0.5 0.5 0.5" 
    animation-mixer="clip: *; loop: repeat; crossFadeDuration: 0">
  </a-gltf-model>
</a-entity>
    </a-scene>
  </body>
</html>
